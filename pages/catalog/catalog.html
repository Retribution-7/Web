<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог услуг | Contractor</title>
    <link rel="stylesheet" href="catalog.css" />
    <!-- Critical preloader styles inline to prevent FOUC -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #191919;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body class="font-inter bg-gray-50 text-[#191919]">
    <div id="preloader" aria-hidden="true" aria-label="Loading">
      <div class="preloader__ring"></div>
    </div>
    <header class="bg-[#191919] py-8 text-white shadow-md">
      <div class="container mx-auto flex items-center justify-between px-4">
        <h1 class="text-h3 font-barlow tracking-tight">Наши услуги</h1>
        <nav class="flex items-center gap-6">
          <a
            href="../favorites/favorites.html"
            class="nav-link-animated font-medium text-gray-300 hover:text-white"
            >🤍 Избранное</a
          >
          <a
            href="../cart/cart.html"
            class="nav-link-animated font-medium text-gray-300 hover:text-white"
            >🛒 Корзина</a
          >
          <a href="/" class="nav-link-animated font-medium text-[#FF4D01]"
            >← На главную</a
          >
        </nav>
      </div>
    </header>

    <main class="container mx-auto px-4 py-12">
      <!-- Filter Panel -->
      <section class="filter-panel" aria-label="Фильтры каталога">
        <div class="w-full flex-1">
          <label
            for="searchInput"
            class="mb-2 ml-1 block text-xs font-bold text-gray-400 uppercase"
            >Поиск</label
          >
          <input
            type="text"
            id="searchInput"
            placeholder="Что вы ищете?..."
            class="filter-input"
          />
        </div>
        <div class="w-full md:w-64">
          <label
            for="categorySelect"
            class="mb-2 ml-1 block text-xs font-bold text-gray-400 uppercase"
            >Категория</label
          >
          <select id="categorySelect" class="filter-input cursor-pointer">
            <option value="">Все категории</option>
          </select>
        </div>
        <div class="w-full md:w-64">
          <label
            for="sortSelect"
            class="mb-2 ml-1 block text-xs font-bold text-gray-400 uppercase"
            >Сортировка</label
          >
          <select id="sortSelect" class="filter-input cursor-pointer">
            <option value="default">По умолчанию</option>
            <option value="price-asc">Сначала дешевые</option>
            <option value="price-desc">Сначала дорогие</option>
            <option value="rating-desc">Высокий рейтинг</option>
            <option value="name-asc">А — Я</option>
          </select>
        </div>
        <div class="w-full md:w-32">
          <label
            for="priceMin"
            class="mb-2 ml-1 block text-xs font-bold text-gray-400 uppercase"
            >Цена от</label
          >
          <input
            type="number"
            id="priceMin"
            placeholder="0"
            min="0"
            class="filter-input"
          />
        </div>
        <div class="w-full md:w-32">
          <label
            for="priceMax"
            class="mb-2 ml-1 block text-xs font-bold text-gray-400 uppercase"
            >Цена до</label
          >
          <input
            type="number"
            id="priceMax"
            placeholder="9999"
            min="0"
            class="filter-input"
          />
        </div>
      </section>

      <!-- Array Method Demo Buttons -->
      <section id="array-methods-container" class="methods-container">
        <button id="btn-map" class="method-btn">.map() (Скидка)</button>
        <button id="btn-filter" class="method-btn">
          .filter() (&gt;1000$)
        </button>
        <button id="btn-sort" class="method-btn">.sort() (Рейтинг)</button>
        <button id="btn-reduce" class="method-btn">.reduce() (Сумма)</button>
        <button id="btn-slice" class="method-btn">.slice() (Топ-3)</button>
        <button id="btn-find" class="method-btn">.find() (VIP)</button>
        <button id="btn-every" class="method-btn">.every() (&gt;10$)</button>
        <button id="btn-some" class="method-btn">.some() (&lt;50$)</button>
        <button id="btn-reverse" class="method-btn">.reverse()</button>
        <button id="btn-findindex" class="method-btn">.findIndex()</button>
        <button id="btn-reset" class="button--orange ml-4 rounded-xl px-6 py-2">
          Сбросить всё
        </button>
      </section>

      <!-- Product Grid -->
      <div id="catalog-container" class="catalog-grid"></div>

      <!-- Pagination (injected by catalog.ts) -->
      <div id="pagination"></div>
    </main>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal-overlay" aria-hidden="true">
      <div
        class="modal-box max-w-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="product-modal-title"
      >
        <div class="modal__header">
          <h2 id="product-modal-title" class="modal__title">Детали</h2>
          <button
            id="btn-product-modal-close"
            class="modal__close"
            aria-label="Закрыть"
          >✕</button>
        </div>
        <div class="product-modal__body">
          <img
            id="product-modal-img"
            src=""
            alt=""
            class="product-modal__img"
          />
          <div class="product-modal__info">
            <div class="flex flex-wrap items-center gap-3 mb-4">
              <span id="product-modal-category" class="category-badge"></span>
              <span id="product-modal-rating" class="badge-rating"></span>
            </div>
            <p id="product-modal-desc" class="font-inter text-p3 text-[#605E5D] leading-relaxed mb-5"></p>
            <div id="product-modal-price" class="mb-6"></div>
            <div class="flex gap-3">
              <button
                id="product-modal-cart-btn"
                class="flex-1 py-3 rounded-xl bg-[#FF4D01] text-white font-inter font-bold text-p3
                       hover:bg-[#e04400] hover:shadow-lg hover:shadow-orange-200
                       disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200"
              >🛒 В корзину</button>
              <button
                id="product-modal-fav-btn"
                class="w-12 h-12 rounded-xl border-2 border-gray-200 flex items-center justify-center
                       text-xl hover:border-[#FF4D01] transition-colors shrink-0"
                title="В избранное"
              >🤍</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./catalog.ts"></script>
  </body>
</html>
