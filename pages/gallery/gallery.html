<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Contractor</title>
    <link rel="stylesheet" href="gallery.css" />
    <style>
      #preloader {
        display: flex;
        position: fixed;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        inset: 0;
        background: #191919;
      }
    </style>
  </head>
  <body class="font-inter">
    <div id="preloader" aria-hidden="true" aria-label="Loading">
      <div class="preloader__ring"></div>
    </div>

    <header class="site-header">
      <div class="container mx-auto flex items-center justify-between px-4">
        <div class="flex items-center gap-2">
          <span class="lang-toggle lang-toggle--active" data-lang="en">en</span>
          <span class="lang-toggle" data-lang="ru">ru</span>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">☀</button>
        </div>
        <h1 class="text-h4 font-barlow tracking-tight" data-i18n="gallery-title">Media Gallery</h1>
        <nav>
          <a href="/" class="nav-link"
            data-i18n="gallery-home">← На главную</a
          >
        </nav>
      </div>
    </header>

    <main class="gallery-page">
      <section class="gallery-display" aria-label="Gallery image viewer">
        <div class="gallery-img-wrap">
          <img
            id="gallery-img"
            class="gallery-img"
            src="/backgrounds/projects/project-1.png"
            alt="Gallery image 1"
          />
          <div
            id="gallery-indicator"
            class="gallery-indicator"
            aria-live="polite"
          >
            ⏸ Stopped
          </div>
          <div id="gallery-counter" class="gallery-counter">1 / 12</div>
        </div>
      </section>

      <section class="gallery-controls" aria-label="Gallery controls">
        <button
          id="btn-prev"
          class="gallery-btn gallery-btn--secondary"
          type="button"
          data-i18n="gallery-prev"
        >
          ← Prev
        </button>
        <button
          id="btn-random"
          class="gallery-btn gallery-btn--primary"
          type="button"
          data-i18n="gallery-random"
        >
          ⚡ Random
        </button>
        <button
          id="btn-next"
          class="gallery-btn gallery-btn--secondary"
          type="button"
          data-i18n="gallery-next"
        >
          Next →
        </button>
      </section>

      <section class="gallery-volume" aria-label="Volume control">
        <label for="volume-slider" class="gallery-volume__label">
          <span class="gallery-volume__icon" id="volume-icon">🔊</span>
          <span data-i18n="gallery-volume">Volume</span>
        </label>
        <input
          type="range"
          id="volume-slider"
          class="gallery-volume__slider"
          min="0"
          max="1"
          step="0.01"
          value="0.5"
          aria-label="Volume"
        />
        <span id="volume-value" class="gallery-volume__value">50%</span>
      </section>

      <p class="gallery-hint" data-i18n="gallery-hint">
        Space — replay sound &nbsp;·&nbsp; ← → arrows — navigate
      </p>
      <!-- VIDEO TRIGGER -->
      <div class="video-trigger" id="video-trigger">
        <img
          src="/images/blog/blog-1.svg"
          alt="Play video"
          class="video-trigger__img"
        />
        <div class="video-trigger__play">
          <span class="video-trigger__icon">▶</span>
        </div>
      </div>

      <!-- VIDEO MODAL -->
      <div class="video-modal" id="video-modal">
        <div class="video-modal__overlay" id="video-overlay"></div>

        <div class="video-modal__content">
          <button class="video-modal__close" id="video-close">✕</button>

          <video id="video-player" class="video-modal__video" controls>
            <source src="/videos/video.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
    </main>

    <script type="module" src="gallery.ts"></script>
  </body>
</html>
