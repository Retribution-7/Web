<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход | Contractor</title>
    <link rel="stylesheet" href="login.css" />
    <!-- Critical preloader styles inline to prevent FOUC -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #191919;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body class="font-inter bg-gray-50 text-[#191919]">
    <div id="preloader" aria-hidden="true" aria-label="Loading">
      <div class="preloader__ring"></div>
    </div>

    <!-- ── Header ──────────────────────────────────────────────────────── -->
    <header class="site-header">
      <div class="container mx-auto flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
          <span class="header-icon">🔑</span>
          <h1 class="header-title">Вход в аккаунт</h1>
        </div>
        <nav class="header-nav">
          <a href="/index.html" class="nav-link">← На главную</a>
        </nav>
      </div>
    </header>

    <!-- ── Main ────────────────────────────────────────────────────────── -->
    <main class="container mx-auto px-4 py-10 md:py-14">
      <div class="login-card">

        <div class="login-card__header">
          <h2 class="login-card__title">Войти</h2>
          <p class="login-card__subtitle">Введите email и пароль от вашего аккаунта</p>
        </div>

        <form id="login-form" novalidate class="login-form">

          <!-- Email -->
          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input
              class="field-input"
              id="email"
              type="email"
              autocomplete="email"
              placeholder="ivan@example.com"
              maxlength="100"
            />
            <p class="field-error hidden" id="err-email" role="alert"></p>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label class="field-label" for="password">Пароль</label>
            <div class="password-row">
              <input
                class="field-input"
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Введите пароль"
                maxlength="20"
              />
              <button
                type="button"
                id="btn-toggle-pwd"
                class="btn-toggle-pwd"
                aria-label="Показать пароль"
                title="Показать / скрыть пароль"
              >👁</button>
            </div>
            <p class="field-error hidden" id="err-password" role="alert"></p>
          </div>

          <!-- Credentials error (shown after failed attempt) -->
          <p class="field-error hidden" id="err-credentials" role="alert"></p>

          <!-- Submit -->
          <button id="btn-submit" type="submit" class="btn-submit" disabled>
            Войти
          </button>

          <p class="login-footer">
            Нет аккаунта?
            <a href="../register/register.html" class="login-link">Зарегистрироваться</a>
          </p>

        </form>
      </div>
    </main>

    <script type="module" src="login.ts"></script>
  </body>
</html>
